<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="All of Subho's web apps and games in one place. Search, favourite and launch them." />
    <title>AppsGo</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Apply the saved theme before the page paints, so there's no flash. -->
    <script>
      try {
        const t = localStorage.getItem('appsGo.theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <!-- Big header on Home; compact (back · title · theme) on other pages. -->
    <header id="hero" class="hero">
      <div class="hero-inner">
        <a id="hero-back" href="#/" class="glass-btn round hero-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </a>
        <h1 id="page-title" class="page-title"></h1>

        <a href="#/" class="hero-brand">
          <span class="hero-title"><span aria-hidden="true">🧩</span> AppsGo</span>
          <span id="status" class="status" hidden></span>
        </a>

        <div class="hero-user">
          <button id="install-btn" class="glass-btn install-btn" type="button" title="Install AppsGo on this device" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span class="install-label">Install</span>
          </button>
          <button id="theme-btn" class="glass-btn round" type="button" aria-label="Switch theme"></button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Search: stays at the top while the page scrolls. -->
      <div class="search-wrap">
        <label class="search card">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="q" class="search-input" type="search" placeholder="Search apps &amp; games" aria-label="Search apps and games" autocomplete="off" enterkeyhint="search" />
          <button id="q-clear" class="search-clear" type="button" aria-label="Clear search" hidden>✕</button>
        </label>
      </div>

      <!-- Home -->
      <section id="view-home" class="view" hidden>
        <div id="home-favs"></div>
        <div id="home-recent"></div>

        <hr class="gradient-divider" />

        <div id="home-apps"></div>
        <div id="home-games"></div>
      </section>

      <!-- Apps / Games / Favourites / search results -->
      <section id="view-list" class="view" hidden>
        <div class="toolbar">
          <span id="list-count" class="muted small"></span>
          <div id="sort" class="seg" role="radiogroup" aria-label="Sort"></div>
        </div>
        <div id="cats" class="pill-group cat-pills" role="radiogroup" aria-label="Category" hidden></div>
        <div id="list" class="app-list"></div>
      </section>
    </main>

    <footer class="footer">Made with <span aria-label="love">❤️</span> by Subho</footer>

    <!-- EXPERIMENTAL: minimized apps that are still running. Tap one to go back to it. -->
    <div id="dock" class="dock" hidden>
      <span id="dock-label" class="dock-label"></span>
      <div id="dock-apps" class="dock-apps"></div>
      <button id="dock-close" class="dock-close" type="button" title="Close all running apps" aria-label="Close all running apps">✕</button>
    </div>

    <!-- Bottom tab bar (phones); a row of tabs under the header on wider screens. -->
    <nav class="bottom-nav" aria-label="Main">
      <a href="#/" data-nav="home" class="nav-item"><span class="nav-icon" aria-hidden="true">🏠</span><span class="nav-label">Home</span></a>
      <a href="#/apps" data-nav="apps" class="nav-item"><span class="nav-icon" aria-hidden="true">📱</span><span class="nav-label">Apps</span></a>
      <a href="#/games" data-nav="games" class="nav-item"><span class="nav-icon" aria-hidden="true">🎮</span><span class="nav-label">Games</span></a>
      <a href="#/favorites" data-nav="favorites" class="nav-item">
        <span class="nav-icon" aria-hidden="true">❤️</span><span class="nav-label">Favourites</span>
        <span id="fav-count" class="nav-badge" hidden></span>
      </a>
    </nav>

    <!-- Details of one app (tap a card). Also opened by a link: #/app/<id> -->
    <dialog id="app-sheet" class="dialog sheet app-sheet" aria-labelledby="as-name">
      <!-- Banner in the app's own colours, with its emoji as a faint watermark. -->
      <div id="as-banner" class="as-banner">
        <div class="sheet-handle" aria-hidden="true"></div>
        <span id="as-mark" class="as-mark" aria-hidden="true"></span>
      </div>
      <div class="as-head">
        <span id="as-icon"></span>
        <h3 id="as-name" class="as-name"></h3>
        <div id="as-meta" class="as-meta"></div>
      </div>
      <p id="as-desc" class="as-desc"></p>
      <div class="as-actions">
        <button class="as-btn" type="button" data-close="cancel" aria-label="Close">
          <span class="as-btn-icon" aria-hidden="true">✕</span><span class="as-btn-label">Close</span>
        </button>
        <button id="as-fav" class="as-btn" type="button" aria-pressed="false">
          <span id="as-fav-icon" class="as-btn-icon" aria-hidden="true">♡</span><span class="as-btn-label">Favourite</span>
        </button>
        <button id="as-share" class="as-btn" type="button">
          <span class="as-btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </span><span class="as-btn-label">Share</span>
        </button>
        <button id="as-open" class="btn btn-gradient as-open" type="button">Open ↗</button>
      </div>
    </dialog>

    <!-- Player: runs an app inside AppsGo, full screen. Link: #/play/<id>. Back / ✕ closes it. -->
    <dialog id="player" class="player" aria-labelledby="pl-name">
      <div class="pl-bar">
        <!-- Left: how many apps are running (tap to switch), then this app -->
        <button id="pl-switch" class="pl-running" type="button" aria-label="Running apps" title="Running apps: tap to switch">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2" /><path d="M16 5.5V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
          <span id="pl-switch-count" class="pl-count"></span>
        </button>
        <span id="pl-icon"></span>
        <div class="pl-titles">
          <strong id="pl-name" class="pl-name"></strong>
          <span id="pl-host" class="pl-host"></span>
        </div>
        <!-- Right: reload · minimize · maximize (own window) · close -->
        <div class="pl-actions">
          <button id="pl-reload" class="pl-btn" type="button" aria-label="Reload app" title="Reload">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <button id="pl-min" class="pl-btn" type="button" aria-label="Minimize: keep it running and go back to AppsGo" title="Minimize">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 17h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" /></svg>
          </button>
          <button id="pl-browser" class="pl-btn" type="button" aria-label="Maximize: open in its own window" title="Open in its own window">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.4" /></svg>
          </button>
          <button id="pl-close" class="pl-btn pl-btn-close" type="button" aria-label="Close app" title="Close app">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" /></svg>
          </button>
        </div>
      </div>
      <div id="pl-stage" class="pl-stage">
        <div id="pl-loading" class="pl-loading">
          <span class="pl-spinner" aria-hidden="true"></span>
          <span>Opening…</span>
          <span id="pl-slow" class="pl-slow" hidden>Taking a while? Tap <b>□</b> above to open it in its own window.</span>
        </div>
      </div>
    </dialog>

    <!-- Running apps (⧉ in the player bar): switch to one, or close it. -->
    <dialog id="switch-sheet" class="dialog sheet" aria-labelledby="sw-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h3 id="sw-title">Running apps</h3>
      <p id="sw-note" class="muted small sw-note"></p>
      <ul id="sw-list" class="sw-list"></ul>
      <button id="sw-home" class="btn btn-ghost sheet-full" type="button">🏠 Back to AppsGo</button>
    </dialog>

    <!-- Running limit reached: pick an app to close, or don't open the new one. -->
    <dialog id="limit-sheet" class="dialog sheet" aria-labelledby="lim-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h3 id="lim-title" class="lim-title"></h3>
      <p class="lim-note">
        <span class="lim-note-icon" aria-hidden="true">ℹ️</span>
        <span>Up to <b class="max-running"></b> apps can run at the same time. Close one to open <b id="lim-new"></b>.</span>
      </p>
      <ul id="lim-list" class="sw-list lim-list"></ul>
      <button id="lim-keep" class="btn btn-ghost sheet-full lim-cancel" type="button" data-close="cancel">Cancel</button>
      <p id="lim-keep-note" class="lim-cancel-note"></p>
    </dialog>

    <!-- Share one app: the AppsGo link (#/app/<id>) is copied as soon as this opens. -->
    <dialog id="share-sheet" class="dialog sheet" aria-labelledby="sh-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sh-head">
        <span id="sh-icon"></span>
        <div class="sh-titles">
          <h3 id="sh-title"></h3>
          <span class="muted small">Share this app with friends</span>
        </div>
      </div>
      <div class="sh-link">
        <input id="sh-url" class="sh-url" type="text" readonly aria-label="App link" />
        <button id="sh-copy" class="sh-copy" type="button">Copy</button>
      </div>
      <div class="sh-targets">
        <a id="sh-whatsapp" class="sh-target" href="#" target="_blank" rel="noopener">
          <span class="sh-target-icon sh-wa" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
          </span>
          <span class="sh-target-label">WhatsApp</span>
        </a>
        <button id="sh-copy-big" class="sh-target" type="button">
          <span class="sh-target-icon sh-cp" aria-hidden="true">🔗</span>
          <span class="sh-target-label">Copy link</span>
        </button>
        <button id="sh-more" class="sh-target" type="button" hidden>
          <span class="sh-target-icon sh-mo" aria-hidden="true">⋯</span>
          <span class="sh-target-label">More</span>
        </button>
      </div>
      <button class="btn btn-ghost sheet-full" type="button" data-close="cancel">Done</button>
    </dialog>

    <!-- Confirm (e.g. clear history). -->
    <dialog id="confirm-sheet" class="dialog sheet" aria-labelledby="confirm-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-hero">
        <span id="confirm-icon" class="sheet-icon" aria-hidden="true"></span>
        <h3 id="confirm-title"></h3>
        <p id="confirm-message" class="muted"></p>
      </div>
      <div class="row sheet-actions">
        <button class="btn btn-ghost grow" type="button" data-close="cancel">Cancel</button>
        <button id="confirm-ok" class="btn btn-danger grow" type="button" data-close="ok">OK</button>
      </div>
    </dialog>

    <!-- Shown when the browser can't install with one tap: explains how to do it manually. -->
    <dialog id="install-dialog" class="dialog sheet" aria-labelledby="install-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h3 id="install-title">📲 Install AppsGo</h3>
      <div id="install-steps"></div>
      <button class="btn btn-gradient sheet-full" type="button" data-close="ok">Got it</button>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
